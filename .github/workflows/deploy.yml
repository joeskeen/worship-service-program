name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, queueing newer runs.
concurrency:
  group: pages
  cancel-in-progress: false

# Minimum scopes: `contents: write` for `git push --force` to gh-pages.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production --base-href=/worship-service-program/

      - name: Publish to gh-pages
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: dist/worship-service-program/browser
          GH_PAGES_BRANCH: gh-pages
          # Match the GitHub-provided bot identity for traceability.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npm run publish:gh-pages --silent
